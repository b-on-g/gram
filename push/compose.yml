services:
  push:
    build: .
    container_name: gram-push
    restart: unless-stopped
    environment:
      # Тот же мастер, что прошит в приложении: смотреть надо туда, где
      # реально лежат ленды пользователей, а не на соседний узел
      GRAM_PUSH_MASTER: https://baza.87.120.36.150.ip.giper.dev/
      GRAM_PUSH_APP: https://b-on-g.github.io/gram/
      # Узел приложения живёт на одном ядре, а каждый обход поднимает
      # свежего клиента и пересинхронизирует ленды подписчиков. Под нагрузкой
      # статьи десятисекундный шаг съедал его заметную часть.
      GRAM_PUSH_POLL: '60000'
      # Пока фича обкатывается, держим подробный лог: по нему видно,
      # какие сессии демон нашёл у подписчика и почему промолчал
      GRAM_PUSH_DEBUG: '1'
    # Прокси живёт в сети host и по имени контейнера нас не видит,
    # поэтому отдаём порт на петлю хоста и проксируем на неё
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - gram_push_data:/data
    # Демон держит ленды подписчиков в памяти и со временем пухнет
    # (известная течь node-клиента), поэтому потолок и авторестарт.
    mem_limit: 512m
    cpus: 0.5
    labels:
      caddy: push.91-188-212-151.ip.giper.dev
      caddy.reverse_proxy: "127.0.0.1:9099"

volumes:
  gram_push_data:
