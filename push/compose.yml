services:
  push:
    build: .
    container_name: gram-push
    restart: unless-stopped
    environment:
      GRAM_PUSH_APP: https://b-on-g.github.io/gram/
      GRAM_PUSH_MASTER: https://cmyser-nd-pony.5.230.182.101.ip.giper.dev/
      # Узел приложения живёт на одном ядре, а каждый обход поднимает
      # свежего клиента и пересинхронизирует ленды подписчиков. Под нагрузкой
      # статьи десятисекундный шаг съедал его заметную часть.
      GRAM_PUSH_POLL: '60000'
      GRAM_PUSH_BIND: 127.0.0.1
    # Из сети bridge на nd наружу не ходит ни HTTPS до Apple, ни npm,
    # поэтому сеть хоста, как у baza и caddy рядом, и слушаем только петлю
    network_mode: host
    logging:
      driver: local
    volumes:
      - gram_push_data:/data
    # Демон держит ленды подписчиков в памяти и со временем пухнет
    # (известная течь node-клиента), поэтому потолок и авторестарт.
    mem_limit: 512m
    cpus: 0.5
    labels:
      caddy: push.5-230-182-101.ip.giper.dev
      caddy.reverse_proxy: "127.0.0.1:9099"
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  gram_push_data:
